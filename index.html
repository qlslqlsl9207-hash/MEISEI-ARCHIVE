<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEISEI ARCHIVE</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: #171717;
      font-family: Georgia, "Hiragino Mincho ProN", serif;
    }

    header {
      padding: 28px 20px;
      border-bottom: 2px solid #171717;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 0 24px;
    }

    .hero {
      padding: 75px 0 60px;
      text-align: center;
    }

    .hero p {
      font-size: clamp(17px, 4.5vw, 24px);
      line-height: 2.2;
      letter-spacing: 1px;
    }

    .image-box {
      margin: 45px auto 0;
      padding: 65px 15px;
      border: 1px solid #ddd;
      color: #888;
      font-size: 13px;
    }

    .menu {
      border-top: 2px solid #171717;
    }

    .menu a {
      display: flex;
      gap: 22px;
      align-items: center;
      padding: 26px 5px;
      border-bottom: 1px solid #ddd;
      color: #171717;
      text-decoration: none;
    }

    .number {
      color: #c52228;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
    }

    .menu-title {
      font-size: 16px;
      line-height: 1.8;
    }

    .menu a:hover {
      color: #c52228;
    }

    footer {
      padding: 55px 20px 25px;
      text-align: center;
      color: #888;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>
  <header>MEISEI ARCHIVE</header>

  <main>
    <section class="hero">
      <p>
        弱気なんかみせないさ<br>
        どんな風の中でも<br>
        ゴールはひとつきりさ
      </p>

      <div class="image-box">
        MEISEI BASEBALL CLUB<br>
        IMAGE COMING SOON
      </div>
    </section>

    <nav class="menu">
      <a href="#championship">
        <span class="number">01</span>
        <span class="menu-title">
          1986年<br>
          全国高等学校野球選手権大会 優勝
        </span>
      </a>

      <a href="#roster">
        <span class="number">02</span>
        <span class="menu-title">優勝当時の選手名簿</span>
      </a>

      <a href="#archive">
        <span class="number">03</span>
        <span class="menu-title">資料室</span>
      </a>

      <a href="#news">
        <span class="number">04</span>
        <span class="menu-title">明青学園野球部 近況</span>
      </a>
    </nav>
  </main>

  <footer>MEISEI ARCHIVE · UNOFFICIAL FAN PROJECT</footer>
</body>
</html>
